<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח התוצאות – הימורי מדגם 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#0B1230;--blue:#2F6BFF;--red:#F0313E;--slip:#FFFFFF;--ink:#111421;--muted:#8C93B3;--line:#E3E6EF;--gold:#FFD43B}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:"Assistant",Arial,sans-serif;color:#fff;background:var(--night);
  background-image:radial-gradient(60vw 60vw at 110% 10%,rgba(47,107,255,.45),transparent 60%),radial-gradient(60vw 60vw at -10% 90%,rgba(240,49,62,.40),transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 22px);
  background-attachment:fixed;min-height:100vh}
.ticker{display:flex;height:38px;background:#fff;color:var(--ink);font-weight:800;overflow:hidden}
.live{background:var(--red);color:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font-family:"Secular One",sans-serif}
.live i{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.track{flex:1;overflow:hidden;position:relative;display:flex;align-items:center}
.track span{white-space:nowrap;position:absolute;animation:tick 38s linear infinite;font-size:15px}
@keyframes tick{from{transform:translateX(-100%)}to{transform:translateX(100vw)}}
main{max-width:680px;margin:0 auto;padding:22px 18px 60px}
h1{font-family:"Secular One",sans-serif;font-weight:400;font-size:clamp(46px,12vw,80px);line-height:1;margin:14px 0 4px;text-align:center;
  background:linear-gradient(90deg,var(--red) 0%,#fff 48%,#fff 52%,var(--blue) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#D6DAF0;margin:0 0 22px}
.status{text-align:center;color:var(--muted);font-size:14px;margin:10px 0 0}
h2{font-family:"Secular One",sans-serif;font-weight:400;font-size:30px;margin:34px 0 12px}
.board{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.board li{display:grid;grid-template-columns:2.4em minmax(5em,10em) 1fr auto;gap:12px;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:12px 14px}
.board li.lead{background:#fff;color:var(--ink);border:0;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.board li.empty{display:block;color:#D6DAF0}
.rk{font-family:"Secular One",sans-serif;font-size:24px;color:var(--muted)}
.lead .rk{color:var(--red)}
.nm{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar{height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden}
.lead .sbar{background:var(--line)}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--blue));transition:width .4s}
.sc{font-family:"Secular One",sans-serif;font-size:22px;min-width:3em;text-align:left}
.crown{font-size:13px;font-weight:800;background:var(--gold);color:var(--ink);border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle}
.q{background:var(--slip);color:var(--ink);border-radius:8px;padding:18px;margin:0 0 12px;border-top:6px solid var(--blue)}
.q:nth-child(even){border-top-color:var(--red)}
.q.done{box-shadow:0 0 0 3px var(--gold)}
.q h3{margin:0;font-size:18px;line-height:1.4;font-weight:800}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.opt{font:inherit;font-weight:800;font-size:16px;padding:8px 14px;border-radius:6px;border:2px solid var(--line);background:#F6F7FB;color:var(--ink);display:inline-flex;gap:8px;align-items:center}
button.opt{cursor:pointer}
button.opt:hover{border-color:var(--blue)}
.opt small{font-weight:600;color:#6B7290}
.opt.right{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.right small{color:#C9CDE0}
.opt.right::before{content:"✓"}
.opt.busy{opacity:.5}
.admin{background:#fff;color:var(--ink);border-radius:10px;padding:18px;margin:6px 0 10px}
.admin b{display:block;font-size:18px;margin-bottom:8px}
.admin input{font:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:6px;width:min(100%,260px)}
.admin button{font-family:"Secular One",sans-serif;font-size:18px;padding:10px 18px;border:0;border-radius:6px;color:#fff;background:linear-gradient(90deg,var(--red),var(--blue));cursor:pointer;margin-inline-start:8px}
.admin .err{color:#C8413A;font-weight:700;margin-top:8px;min-height:1.4em}
.banner{background:var(--gold);color:var(--ink);font-weight:800;border-radius:8px;padding:10px 14px;text-align:center;margin:6px 0 10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.track span{position:static;padding:0 12px}}
</style>
</head>
<body>
<div class="ticker" aria-hidden="true"><div class="live"><i></i>שידור חי</div><div class="track"><span>מבזק: התוצאות זורמות • הטבלה מתעדכנת בזמן אמת • מי יזכה בתהילת עולם? • מבזק: התוצאות זורמות • הטבלה מתעדכנת בזמן אמת</span></div></div>
<main>
  <h1>לוח התוצאות</h1>
  <p class="sub">הימורי מדגם 2026</p>
  <div class="admin" id="login" hidden>
    <b>מצב עריכה</b>
    <input id="pin" type="password" placeholder="סיסמה" autocomplete="current-password"><button id="go">כניסה</button>
    <div class="err" id="loginerr" role="status"></div>
  </div>
  <div class="banner" id="banner" hidden>מצב עריכה: לחצו על התשובה הנכונה. לחיצה נוספת מבטלת.</div>
  <h2>הטבלה</h2>
  <ol class="board" id="board"></ol>
  <p class="status" id="resolved"></p>
  <p class="status" id="status"></p>
  <h2>השאלות</h2>
  <div id="questions"></div>
</main>
<script>
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeLm-gddKFyxhq3Qc6CN3LS4DB4V2OQwzd-zL-2QUhmKH2iVw/formResponse";
const NAME_ENTRY = "entry.1334412400";
const SHEET_ID = "1RJNS546xWlWuSTTebz1pxkSDXs29JYc9jyGjqgLUsHY";
const DATA_GID = "689895731";
const KEY_GID = "1520373364";
const QS = [
  {e:784427882, t:"האם במדגם כלשהו יהיה לאחד הגושים 61?", n:"וינטר נחשב גוש ימין, למרות מה שביבי אמר", o:["כן","לא"]},
  {e:1544510882, t:"איזה גוש יקבל יותר מנדטים במדגם של 12?", o:[{v:"ימין",s:"ועמית סגל לא יסתיר את החיוך"},{v:"שמאל",s:"וכל שאר האולפן יפתח שמפניה"},"תיקו"]},
  {e:403190113, t:"האם וינטר עובר במדגם כלשהו?", n:"(בכל מקרה אנחנו זכינו בלקח חשוב לחיים. השאלה אם הוא יהיה „תאמין בעצמך” או „אל תהיה יהיר”)", o:["כן","לא"]},
  {e:739464245, t:"האם הנדל/זליכה עוברים במדגם כלשהו?", o:["כן","לא"]},
  {e:1439004292, t:"כמה מנדטים בנט מקבל במדגם של 12?", o:[{v:"0-12",s:"כי בנט יהיה בנט"},{v:"13-14",s:"כי הפעם הקמפיין היה אחלה"},{v:"15+",s:"כי הוא איש כריזמטי וחולים לו על הקרחת"}]},
  {e:841398233, t:"בסקר האחרון של 14 הליכוד קיבלו 30. כמה הם יקבלו במדגם?", o:["0-24","25-27","28-29","30+"]},
  {e:152578877, t:"איזה ראש מפלגה ינאם ראשון?", o:["בנט","ביבי","אייזנקוט","סמוטריץ'","בן גביר","יאיר גולן"]},
  {e:14311346, t:"נתניהו יעלה לנאום לפני או אחרי 1:00?", o:["לפני","אחרי","לא ינאם"]},
  {e:1541717563, t:"אחוז ההצבעה הסופי יהיה הכי גבוה בעשור האחרון?", o:["כן","לא",{v:"שחור לבן",s:"(שזו אופציה מטופשת לבחור והקול שלכם ילך לפח. כמו מי שהצביע לוינטר)"}]},
  {e:1627692703, t:"האם במהלך הערב ראש מפלגה כלשהו יכריז על ניצחון?", n:"המילה „ניצחון” חייבת להיאמר", o:["כן","לא"]},
  {e:1337562928, t:"במטה של הציונות הדתית יהיו…", o:["בלונים","קונפטי","גם וגם","לא זה ולא זה"]},
  {e:1914875240, t:"כמה סמוטריץ׳ מקבל ב־12?", o:["לא עובר","4-5","6","7+"]},
  {e:1129570437, t:"מי מקבל יותר במדגם של 12?", o:["בן גביר","ש\"ס","תיקו"]},
  {e:2083267577, t:"מה יהיה הפער בין גוש הימין של 14 לגוש הימין של 12?", n:"(בסקר האחרון הפער היה 12 מנדטים)", o:["0-4","5-8","9+"]},
  {e:1416936996, t:"מי יקבל יותר במדגם של 12, ביבי או אייזנקוט?", o:["ביבי","אייזנקוט","תיקו"]},
  {e:462699298, t:"האם מפלגה כלשהי מהבאות לא תעבור?", n:"הציונות הדתית, בנט, ליברמן, רע״מ, בן גביר, ש״ס", o:["כן","לא"]},
  {e:435380632, t:"האם תהיה „הפתעת הבחירות”, ומפלגה כלשהי תקבל הרבה יותר ממה שנתנו לה הסקרים של אותו ערוץ?", n:"הפתעה = עלייה של 40% לפחות", o:["כן","לא"]},
  {e:929970103, t:"האם חנוך דאום ישתתף בשידורים של 12 במהלך הערב?", o:["כן","לא"]},
  {e:1747819989, t:"העדכון הראשון של 12 יהיה לטובת…", o:["ימין","שמאל","עדכון בתוך הגושים"]},
  {e:266464563, t:"איזה ערוץ ייתן הכי הרבה מנדטים לגוש הימין?", n:"שימו לב: בבחירות האחרונות ערוץ 14 לא נתן במדגם לימין יותר מהערוצים האחרים", o:["11","12","13","14"]},
  {e:107573084, t:"בסקר האחרון של 12 הליכוד קיבלו 20. כמה הם יקבלו במדגם?", o:["מתחת ל-20","20-22","23-24","25+"]}
];
QS.forEach(q=>{q.o=q.o.map(o=>typeof o==="string"?o:o.v);});
const LOG_URL="https://docs.google.com/forms/d/e/1FAIpQLSe9w7TEMUUB8vGMvFLhSIfpvFsN5KcNzr9C1DLiKtYecla6vg/formResponse";
const LOG_ENTRY="entry.1120294965";
const LOG_GID="1074118146";
const ADMIN_H="cfe99d395a01a96412f9f578e5921f48d141950ea7091d90172e170322152729";
const $=id=>document.getElementById(id);
let people=[], correct={}, token=null, pending={};
const isAdmin=location.hash==="#admin";
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function gviz(gid){return "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&headers=0&gid="+gid+"&t="+Date.now();}
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cell);cell="";}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell="";}
    else if(c!=='\r') cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows;
}
const norm=s=>String(s).trim().replace(/[–—]/g,"-");
const okTokens={};
async function validToken(t){ if(!(t in okTokens)) okTokens[t]=(await sha(t))===ADMIN_H; return okTokens[t]; }
async function load(){
  try{
    const [d,k,l]=await Promise.all([gviz(DATA_GID),gviz(KEY_GID),gviz(LOG_GID)].map(u=>fetch(u).then(r=>r.text())));
    const byName=new Map();
    parseCSV(d).forEach(r=>{
      const line=(r[0]||"").trim(); if(!line) return;
      const parts=line.split("|"); if(parts.length<QS.length+1) return;
      const name=parts[0].trim(); if(!name) return;
      byName.set(name.toLowerCase(),{name,a:parts.slice(1,QS.length+1).map(norm)});
    });
    people=[...byName.values()];
    const c={};
    const krows=parseCSV(k);
    let start=krows.findIndex(r=>norm(r[0]||"")==="שאלה"); start=start===-1?0:start+1;
    QS.forEach((q,i)=>{const r=krows[start+i]; if(!r) return; const v=parseInt(norm(r[1]||""),10); if(v>=1&&v<=q.o.length) c[i]=q.o[v-1];});
    for(const r of parseCSV(l)){
      const p=(r[1]||"").trim().split("|"); if(p.length!==3) continue;
      const qi=parseInt(p[0],10)-1, ai=parseInt(p[1],10);
      if(!(qi>=0&&qi<QS.length)) continue;
      if(!(await validToken(p[2]))) continue;
      if(ai===0) delete c[qi]; else if(ai>=1&&ai<=QS[qi].o.length) c[qi]=QS[qi].o[ai-1];
    }
    Object.keys(pending).forEach(qi=>{ const want=pending[qi]; if((c[qi]||"")===want) delete pending[qi]; else { if(want) c[qi]=want; else delete c[qi]; } });
    correct=c; render();
    $("status").textContent="עודכן ב־"+new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  }catch(e){ $("status").textContent="לא הצלחתי לטעון את הנתונים. מנסה שוב בעוד רגע…"; }
}
function render(){
  const ids=QS.map((q,i)=>i).filter(i=>correct[i]!==undefined);
  $("resolved").textContent=(people.length?people.length+" משתתפים. ":"")+(ids.length?"הוכרעו "+ids.length+" מתוך "+QS.length+" שאלות.":"עוד לא הוכרעה אף שאלה.");
  const rows=people.map(p=>({name:p.name,s:ids.filter(i=>p.a[i]===correct[i]).length})).sort((a,b)=>b.s-a.s||a.name.localeCompare(b.name,"he"));
  const b=$("board");b.textContent="";
  if(!rows.length){const li=document.createElement("li");li.className="empty";li.textContent="עוד אין משתתפים.";b.appendChild(li);}
  else{
    const top=rows[0].s;let rank=0,prev=null;
    const allDone=ids.length===QS.length;
    rows.forEach((r,i)=>{
      if(r.s!==prev){rank=i+1;prev=r.s;}
      const li=document.createElement("li");const lead=ids.length&&r.s===top;if(lead)li.className="lead";
      const rk=document.createElement("span");rk.className="rk";rk.textContent=rank;
      const nm=document.createElement("span");nm.className="nm";nm.textContent=r.name;
      if(lead){const cr=document.createElement("span");cr.className="crown";cr.textContent=allDone?"ניצח/ה!":"מוביל/ה";nm.appendChild(cr);}
      const bar=document.createElement("span");bar.className="sbar";const f=document.createElement("i");f.style.width=(ids.length?r.s/ids.length*100:0)+"%";bar.appendChild(f);
      const sc=document.createElement("span");sc.className="sc";sc.textContent=r.s+(ids.length?"/"+ids.length:"");
      li.append(rk,nm,bar,sc);b.appendChild(li);
    });
  }
  const root=$("questions");root.textContent="";
  QS.forEach((q,i)=>{
    const card=document.createElement("div");card.className="q"+(correct[i]!==undefined?" done":"");
    const h3=document.createElement("h3");h3.textContent=(i+1)+". "+q.t;card.appendChild(h3);
    const opts=document.createElement("div");opts.className="opts";
    q.o.forEach((o,k)=>{
      const s=document.createElement(token?"button":"span");s.className="opt"+(correct[i]===o?" right":"");
      if(token){s.type="button";s.setAttribute("aria-pressed",correct[i]===o?"true":"false");s.addEventListener("click",()=>setAnswer(i,correct[i]===o?0:k+1,s));}
      const t=document.createElement("span");t.textContent=o;
      const c=document.createElement("small");c.textContent=people.filter(p=>p.a[i]===norm(o)).length;
      s.append(t,c);opts.appendChild(s);
    });
    card.appendChild(opts);root.appendChild(card);
  });
}
async function setAnswer(qi,ai,btn){
  btn.classList.add("busy");
  const want=ai?QS[qi].o[ai-1]:"";
  pending[qi]=want;
  if(want) correct[qi]=want; else delete correct[qi];
  render();
  const body=new URLSearchParams();body.append(LOG_ENTRY,(qi+1)+"|"+ai+"|"+token);
  try{await fetch(LOG_URL,{method:"POST",mode:"no-cors",body});}
  catch(e){$("status").textContent="השמירה נכשלה. בדקו את החיבור ונסו שוב.";delete pending[qi];load();}
}
async function login(pin){
  const t=await sha(pin.trim());
  if((await sha(t))!==ADMIN_H) return false;
  token=t; try{localStorage.setItem("md26-admin",pin.trim());}catch(e){}
  $("login").hidden=true;$("banner").hidden=false;render();return true;
}
if(isAdmin){
  $("login").hidden=false;
  $("go").addEventListener("click",async()=>{ if(!(await login($("pin").value))){$("loginerr").textContent="סיסמה שגויה.";} });
  $("pin").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click();});
  try{const saved=localStorage.getItem("md26-admin"); if(saved) login(saved);}catch(e){}
}
render();load();setInterval(load,isAdmin?8000:20000);
</script>
</body>
</html>
